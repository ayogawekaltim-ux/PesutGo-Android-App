name: Build PesutGo Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build PesutGo APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build signed Debug APK
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/PesutGo-debug.apk

      - name: Upload PesutGo APK
        uses: actions/upload-artifact@v4
        with:
          name: PesutGo-Android-APK
          path: app/build/outputs/apk/debug/PesutGo-debug.apk
          if-no-files-found: error
